name: Update upstream versions

on:
  schedule:
    # Every day at 03:17 UTC.
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    name: Refresh package versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq jq

      - name: Refresh versions
        id: update
        run: |
          sh ./scripts/update-version.sh
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"
          fi

      - name: Create pull request
        if: steps.update.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore: update v2rayA to ${{ steps.update.outputs.version }}"
          title: "Update v2rayA to ${{ steps.update.outputs.version }}"
          body: |
            Automated refresh of the upstream versions and hashes.

            This PR was generated by `scripts/update-version.sh`. It updates
            the v2rayA service/core, the LuCI app version, the Go toolchain
            and the v2fly GeoIP/GeoSite databases when their upstream
            releases changed.

            **AI-assisted:** this project is maintained with AI assistance.
          branch: update/v2raya-${{ steps.update.outputs.version }}
          delete-branch: true
